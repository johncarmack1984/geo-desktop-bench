name: ci

# PR gate: typecheck the CDK infra and the three TypeScript frontends, so a type
# error (including a breaking dependency bump) can't merge — merging main redeploys.
# The full site build is validated at deploy: it needs sample data and a Vite build,
# too heavy to re-run per PR. Holds no AWS creds and does not deploy — deploy stays
# in deploy.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geobench-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10 # matches deploy.yml (no root packageManager pin)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - name: Install
        run: |
          pnpm -C infra install --frozen-lockfile
          pnpm -C geo-render-bench install --frozen-lockfile
          pnpm -C web-capstone install --frozen-lockfile
          pnpm -C shell-bench/frontend install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm -C infra run typecheck
          pnpm -C geo-render-bench exec tsc --noEmit
          pnpm -C web-capstone exec tsc --noEmit
          pnpm -C shell-bench/frontend exec tsc --noEmit
